services:
  - type: web
    name: shelfscan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shelfscan-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://shelf-scan-dmq6.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ACTIVE_USER_WINDOW_MINUTES
        value: "30"
      - key: ACTIVITY_UPDATE_SECONDS
        value: "300"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: shelfscan-db
    databaseName: shelfscan
    user: shelfscan
    plan: basic-256mb
